<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" width="1040" height="760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1580c"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <style>
      .t{fill:#1f2328;font-size:15px;font-weight:600}
      .s{fill:#57606a;font-size:12px}
      .z{fill:#57606a;font-size:12px;font-weight:700;letter-spacing:2px}
      .box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
      .row{fill:#f6f8fa;stroke:#d0d7de}
      .file{fill:#ddf4ff;stroke:#54aeff}
      .ft{fill:#0a3069;font-size:11px}
      .w{stroke:#d1580c;stroke-width:2.5;fill:none}
      .wl{fill:#d1580c;font-size:12px;font-weight:600}
      .p{stroke:#8250df;stroke-width:2;stroke-dasharray:6 4;fill:none}
      .pl{fill:#8250df;font-size:12px;font-weight:600}
      .rb{fill:#0969da}
      .rt{fill:#fff;font-size:11px;font-weight:700}
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="760" fill="#ffffff"/>

  <!-- API -->
  <rect x="40" y="20" width="960" height="60" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="520" y="45" text-anchor="middle" class="t">Your program  (strata is an embedded library)</text>
  <text x="160" y="66" text-anchor="middle" class="s">writes: put · delete · write_batch</text>
  <text x="840" y="66" text-anchor="middle" class="s">reads: get · scan · snapshot</text>

  <!-- MEMORY zone -->
  <rect x="40" y="105" width="960" height="150" rx="10" fill="none" stroke="#afb8c1" stroke-dasharray="8 5"/>
  <text x="56" y="124" class="z">MEMORY</text>

  <rect x="60" y="140" width="200" height="95" rx="8" class="box"/>
  <text x="160" y="168" text-anchor="middle" class="t">Write queue</text>
  <text x="160" y="190" text-anchor="middle" class="s">group commit: one leader</text>
  <text x="160" y="206" text-anchor="middle" class="s">writes the batch for many</text>
  <text x="160" y="222" text-anchor="middle" class="s">waiting writers</text>

  <rect x="340" y="140" width="230" height="95" rx="8" class="box"/>
  <text x="455" y="168" text-anchor="middle" class="t">Memtable (active)</text>
  <text x="455" y="190" text-anchor="middle" class="s">sorted map of internal keys</text>
  <text x="455" y="206" text-anchor="middle" class="s">user_key ↑ then seqno ↓</text>
  <text x="455" y="222" text-anchor="middle" class="s">(newest version first)</text>

  <rect x="650" y="140" width="230" height="95" rx="8" class="box"/>
  <text x="765" y="168" text-anchor="middle" class="t">Immutable memtable</text>
  <text x="765" y="190" text-anchor="middle" class="s">frozen when full,</text>
  <text x="765" y="206" text-anchor="middle" class="s">still readable while</text>
  <text x="765" y="222" text-anchor="middle" class="s">it is being flushed</text>

  <!-- write path arrows -->
  <path d="M160 80 L160 138" class="w" marker-end="url(#aw)"/>
  <path d="M260 187 L338 187" class="w" marker-end="url(#aw)"/>
  <text x="299" y="178" text-anchor="middle" class="wl">W2 insert</text>
  <path d="M570 187 L648 187" class="w" marker-end="url(#aw)"/>
  <text x="609" y="178" text-anchor="middle" class="wl">full →</text>
  <text x="609" y="206" text-anchor="middle" class="wl">freeze</text>
  <path d="M160 235 L160 308" class="w" marker-end="url(#aw)"/>
  <text x="172" y="275" class="wl">W1 append + sync</text>
  <text x="172" y="290" class="s">(before memtable)</text>

  <!-- DISK zone -->
  <rect x="40" y="280" width="960" height="330" rx="10" fill="none" stroke="#afb8c1" stroke-dasharray="8 5"/>
  <text x="56" y="299" class="z">DISK</text>

  <rect x="60" y="310" width="200" height="95" rx="8" class="box"/>
  <text x="160" y="338" text-anchor="middle" class="t">WAL</text>
  <text x="160" y="360" text-anchor="middle" class="s">append-only log file</text>
  <text x="160" y="376" text-anchor="middle" class="s">CRC on every record</text>
  <text x="160" y="392" text-anchor="middle" class="s">replayed after a crash</text>

  <rect x="60" y="430" width="200" height="155" rx="8" class="box"/>
  <text x="160" y="458" text-anchor="middle" class="t">MANIFEST + CURRENT</text>
  <text x="160" y="480" text-anchor="middle" class="s">log of VersionEdits:</text>
  <text x="160" y="496" text-anchor="middle" class="s">"file 12 added to L1",</text>
  <text x="160" y="512" text-anchor="middle" class="s">"file 7 removed from L0"</text>
  <text x="160" y="536" text-anchor="middle" class="s">→ builds a Version (which</text>
  <text x="160" y="552" text-anchor="middle" class="s">files are live); readers</text>
  <text x="160" y="568" text-anchor="middle" class="s">hold Arc&lt;Version&gt;</text>

  <!-- levels -->
  <rect x="340" y="305" width="610" height="70" rx="6" class="row"/>
  <text x="358" y="345" class="t">L0</text>
  <text x="395" y="337" class="s">fresh flushes</text>
  <text x="395" y="353" class="s">key ranges may overlap</text>
  <rect x="680" y="314" width="120" height="24" rx="3" class="file"/><text x="740" y="330" text-anchor="middle" class="ft">sst a – m</text>
  <rect x="745" y="342" width="120" height="24" rx="3" class="file"/><text x="805" y="358" text-anchor="middle" class="ft">sst c – z</text>

  <rect x="340" y="390" width="610" height="70" rx="6" class="row"/>
  <text x="358" y="430" class="t">L1</text>
  <text x="395" y="422" class="s">one sorted run</text>
  <text x="395" y="438" class="s">files never overlap</text>
  <rect x="600" y="413" width="75" height="24" rx="3" class="file"/><text x="637" y="429" text-anchor="middle" class="ft">a – f</text>
  <rect x="675" y="413" width="75" height="24" rx="3" class="file"/><text x="712" y="429" text-anchor="middle" class="ft">g – l</text>
  <rect x="750" y="413" width="75" height="24" rx="3" class="file"/><text x="787" y="429" text-anchor="middle" class="ft">m – r</text>
  <rect x="825" y="413" width="75" height="24" rx="3" class="file"/><text x="862" y="429" text-anchor="middle" class="ft">s – z</text>

  <rect x="340" y="475" width="610" height="70" rx="6" class="row"/>
  <text x="358" y="515" class="t">L2</text>
  <text x="395" y="507" class="s">~10× bigger than L1</text>
  <text x="395" y="523" class="s">oldest data lives deepest</text>
  <g class="file">
    <rect x="600" y="498" width="37.5" height="24" rx="3"/><rect x="637.5" y="498" width="37.5" height="24" rx="3"/>
    <rect x="675" y="498" width="37.5" height="24" rx="3"/><rect x="712.5" y="498" width="37.5" height="24" rx="3"/>
    <rect x="750" y="498" width="37.5" height="24" rx="3"/><rect x="787.5" y="498" width="37.5" height="24" rx="3"/>
    <rect x="825" y="498" width="37.5" height="24" rx="3"/><rect x="862.5" y="498" width="37.5" height="24" rx="3"/>
  </g>
  <text x="645" y="572" text-anchor="middle" class="s">… L3 … Ln (each level ~10× the previous)</text>

  <!-- SSTable anatomy hint -->
  <text x="645" y="595" text-anchor="middle" class="s">each SSTable = data blocks + index block + bloom filter + footer (all CRC-checked, immutable)</text>

  <!-- background work -->
  <path d="M765 235 L765 312" class="p" marker-end="url(#ap)"/>
  <text x="777" y="275" class="pl">flush</text>
  <text x="777" y="290" class="pl">(bg thread)</text>
  <path d="M950 340 C 990 350, 990 415, 952 425" class="p" marker-end="url(#ap)"/>
  <path d="M950 425 C 990 435, 990 500, 952 510" class="p" marker-end="url(#ap)"/>
  <text x="995" y="470" class="pl" text-anchor="end" transform="rotate(-90 995 470)">compaction</text>

  <!-- version tracking -->
  <path d="M338 470 L262 470" stroke="#57606a" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#ag)"/>
  <text x="300" y="462" text-anchor="middle" class="s">tracks</text>

  <!-- read path badges -->
  <g><circle cx="560" cy="150" r="13" class="rb"/><text x="560" y="154" text-anchor="middle" class="rt">R1</text></g>
  <g><circle cx="870" cy="150" r="13" class="rb"/><text x="870" y="154" text-anchor="middle" class="rt">R2</text></g>
  <g><circle cx="940" cy="318" r="13" class="rb"/><text x="940" y="322" text-anchor="middle" class="rt">R3</text></g>
  <g><circle cx="940" cy="403" r="13" class="rb"/><text x="940" y="407" text-anchor="middle" class="rt">R4</text></g>
  <g><circle cx="940" cy="488" r="13" class="rb"/><text x="940" y="492" text-anchor="middle" class="rt">R5</text></g>

  <!-- FileSystem -->
  <rect x="40" y="630" width="960" height="55" rx="8" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/>
  <text x="520" y="652" text-anchor="middle" class="t">FileSystem trait: every byte on disk goes through here</text>
  <text x="290" y="673" text-anchor="middle" class="s">OsFs: the real disk (fsync; F_FULLFSYNC on macOS)</text>
  <text x="760" y="673" text-anchor="middle" class="s">FaultyFs: in-memory; simulates crashes, torn writes, I/O errors</text>

  <!-- legend -->
  <path d="M60 718 L100 718" class="w" marker-end="url(#aw)"/>
  <text x="110" y="722" class="s">write path (W1 → W2): log first, then memory</text>
  <circle cx="440" cy="718" r="10" class="rb"/><text x="440" y="722" text-anchor="middle" class="rt" style="font-size:9px">R</text>
  <text x="458" y="722" class="s">read path order: stop at the first match (newest wins)</text>
  <path d="M790 718 L830 718" class="p" marker-end="url(#ap)"/>
  <text x="840" y="722" class="s">background threads</text>
</svg>
