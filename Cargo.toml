[package]
name = "strata"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "An embedded LSM-tree key-value storage engine, built from scratch for learning."
repository = "https://github.com/prajwalhiremath-dev/strata"
readme = "README.md"
keywords = ["database", "lsm", "storage", "key-value", "embedded"]
categories = ["database-implementations"]

[dependencies]
thiserror = "2"
parking_lot = "0.12"
crc32fast = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
